[project]
name = "aisich"
version = "0.1.0"
description = "AISICH application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg==0.29.0",
    "boto3==1.34.162",
    "faiss-cpu==1.8.0.post1",
    "fastapi==0.115.14",
    "httpx==0.28.1",
    "litellm==1.97.0",
    "numpy==1.26.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "fastembed==0.7.3",
    "uvicorn[standard]>=0.30.6,<1.0",
    "google-antigravity>=0.1.14",
    "claude-agent-sdk>=0.2.144",
    "google-genai>=2.20.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.23.8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"        # keep whatever else is already in this section
