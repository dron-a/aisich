    "boto3==1.34.162",
    "faiss-cpu==1.8.0.post1",
    "fastapi==0.115.14",
    "httpx==0.28.1",
    "litellm==1.97.0",
    "numpy==1.26.4",
    "openai==2.54.0",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "scikit-learn==1.9.0",
    "sentence-transformers==3.0.1",
    "torch==2.13.0",
    "uvicorn==0.30.6",
