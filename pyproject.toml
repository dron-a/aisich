[project]
name = "aisich"
version = "0.1.0"
description = "AISICH application"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg==0.29.0",
    "boto3==1.34.162",
    "faiss-cpu==1.8.0.post1",
    "fastapi==0.115.14",
    "httpx==0.28.1",
    "litellm==1.97.0",
    "numpy==1.26.4",
    "pydantic-settings==2.15.0",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "sentence-transformers==3.0.1",
    "torch==2.13.0",
    "uvicorn[standard]==0.30.6",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.23.8",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"        # keep whatever else is already in this section