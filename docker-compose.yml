services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-evolution_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-evolution_dev_pw}
      POSTGRES_DB: ${PG_DB:-whatsmiau}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-evolution_user} -d ${PG_DB:-whatsmiau}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: >
      redis-server 
      --maxmemory 128mb 
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 160M

  whatsmiau:
    image: ghcr.io/dron-a/aisich-whatsmiau:latest
    restart: unless-stopped
    ports:
      # Bound to localhost so you can access the QR dashboard securely
      - "127.0.0.1:8085:8080"
    environment:
      - PORT=8080
      - API_KEY=${WHATSMIAU_API_KEY:-dev_key}
      - REDIS_URL=redis://redis:6379
      - DIALECT_DB=postgres
      - DATABASE_URL=postgresql://${PG_USER:-evolution_user}:${PG_PASSWORD:-evolution_dev_pw}@postgres:5432/${PG_DB:-whatsmiau}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 350M

  aisich:
    # Build locally using the optimized Dockerfile or pull from GHCR
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/dron-a/aisich:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./aisich.env
    depends_on:
      postgres:
        condition: service_healthy
      whatsmiau:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 1500M

volumes:
  pg_data:
  redis_data: