services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7     # we'll verify the real version in step 1 below
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution_user:evolution_dev_pw@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=false
      - DATABASE_SAVE_MESSAGE_UPDATE=false
      - DATABASE_SAVE_DATA_CONTACTS=false
      - DATABASE_SAVE_DATA_CHATS=false
      - DATABASE_SAVE_DATA_LABELS=false
      - DATABASE_SAVE_DATA_HISTORIC=false
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379
      # - WEBHOOK_GLOBAL_ENABLED=true
      # - WEBHOOK_GLOBAL_URL=http://host.docker.internal:8000/webhook
      # - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - LOG_LEVEL=ERROR,WARN
      - DEL_INSTANCE=false
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"

  postgres:
    image: postgres:16.4
    ports:
      - "5432:5432"                            # exposed so the aisich (on host) can reach aisichdb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${PG_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql   # runs ONCE on first boot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4
    volumes:
      - redis_data:/data

volumes:
  evolution_instances:
  pg_data:
  redis_data: